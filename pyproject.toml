[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprite-forge"
version = "0.1.0"
description = "Turn any pixel-art image into clean game sprites, new poses and animations."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Isabella Greco" }]
dependencies = ["pillow>=10", "numpy>=1.24", "scipy>=1.10"]
keywords = ["pixel-art", "sprites", "game-dev", "animation"]

[project.urls]
Homepage = "https://github.com/isabellagreco1997/sprite-forge"

[project.scripts]
spriteforge = "spriteforge.cli:main"

[tool.setuptools]
packages = ["spriteforge"]
